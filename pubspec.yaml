name: sheride_rider
description: "SheRide Rider/Captain App - Empowering Women Drivers & Commuters."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.4
  firebase_storage: ^12.3.2
  mapbox_maps_flutter: ^2.3.0
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  go_router: ^14.2.7
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^6.0.5
  google_sign_in: ^6.2.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/vehicles/
    - assets/icons/
